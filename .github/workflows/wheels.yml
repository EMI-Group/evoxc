name: Wheels

on:
  workflow_call:
    inputs:
      checkout_sha:
        description: Commit selected by the release workflow
        required: true
        type: string
      version:
        description: Expected evoxc distribution version
        required: true
        type: string
    outputs:
      artifact_id:
        description: Immutable artifact ID of the verified evoxc-dist upload
        value: ${{ jobs.collect.outputs.artifact_id }}

permissions:
  contents: read

env:
  EVOXC_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  linux:
    name: wheel (linux-${{ matrix.arch }}-${{ matrix.libc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            libc: manylinux2014
            target: x86_64-unknown-linux-gnu
            manylinux: '2014'
          - os: ubuntu-24.04
            arch: x86_64
            libc: musllinux_1_2
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: ubuntu-24.04-arm
            arch: aarch64
            libc: manylinux2014
            target: aarch64-unknown-linux-gnu
            manylinux: '2014'
          - os: ubuntu-24.04-arm
            arch: aarch64
            libc: musllinux_1_2
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_sha }}
          persist-credentials: false

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist

      # Do not test a musllinux wheel on the glibc host or let a modern glibc
      # hide an accidental baseline increase. Mount only the wheel and helper.
      - name: Install and smoke-test on the target libc and architecture
        shell: bash
        env:
          SMOKE_IMAGE: quay.io/pypa/${{ matrix.libc }}_${{ matrix.arch }}:latest
        run: |
          docker run --rm --workdir /tmp \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/.github/workflows/smoke_evoxc.py:/smoke_evoxc.py:ro" \
            --entrypoint /opt/python/cp311-cp311/bin/python "$SMOKE_IMAGE" \
            -I /smoke_evoxc.py /dist '*.whl' "$EVOXC_RELEASE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: evoxc-wheel-linux-${{ matrix.arch }}-${{ matrix.libc }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  native:
    name: wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner image upgrades must not raise the wheel deployment targets.
          - os: macos-15-intel
            name: macos-x86_64
            python_arch: x64
            target: x86_64-apple-darwin
            deployment_target: '10.12'
          - os: macos-15
            name: macos-arm64
            python_arch: arm64
            target: aarch64-apple-darwin
            deployment_target: '11.0'
          - os: windows-2025
            name: windows-x86_64
            python_arch: x64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist

      - name: Install and smoke-test the wheel
        shell: bash
        run: python -I .github/workflows/smoke_evoxc.py dist '*.whl' "$EVOXC_RELEASE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: evoxc-wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          container: 'off'
          args: --out dist

      - name: Build from the source archive, install and smoke-test
        run: python -I .github/workflows/smoke_evoxc.py dist '*.tar.gz' "$EVOXC_RELEASE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: evoxc-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect and verify evoxc distributions
    needs: [linux, native, sdist]
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: evoxc-wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: evoxc-sdist
          path: dist

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Verify the wheel matrix, version and archive contents
        run: |
          python -I - <<'PY'
          import os
          from pathlib import Path
          import re
          import tarfile
          import zipfile

          version = os.environ["EVOXC_RELEASE_VERSION"]
          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdist = dist / f"evoxc-{version}.tar.gz"
          assert len(wheels) == 7 and set(dist.iterdir()) == {*wheels, sdist}, sorted(dist.iterdir())

          expected = {
              "manylinux_2_17_x86_64", "manylinux_2_17_aarch64",
              "musllinux_1_2_x86_64", "musllinux_1_2_aarch64",
              "macosx_10_12_x86_64", "macosx_11_0_arm64", "win_amd64",
          }
          prefix = f"evoxc-{version}-cp311-abi3-"
          seen = set()
          for wheel in wheels:
              assert wheel.name.startswith(prefix), wheel.name
              tags = set(wheel.stem.removeprefix(prefix).replace("manylinux2014_", "manylinux_2_17_").split("."))
              assert len(tags) == 1 and tags <= expected and not tags & seen, wheel.name
              seen.update(tags)
              with zipfile.ZipFile(wheel) as archive:
                  entries = archive.infolist()
                  names = [entry.filename for entry in entries]
                  tops = {name.split("/", 1)[0] for name in names}
                  expected_tops = {"evoxc", f"evoxc-{version}.dist-info"}
                  unexpected = sorted(tops - expected_tops - {"evoxc.libs"})
                  assert not unexpected, (wheel.name, "unexpected top-level entries", unexpected, sorted(tops))
                  missing = sorted(expected_tops - tops)
                  assert not missing, (wheel.name, "missing top-level entries", missing, sorted(tops))
                  bundled = [name for name in names
                             if name == "evoxc.libs" or name.startswith("evoxc.libs/")]
                  bad = [name for name in bundled if name != "evoxc.libs/" and not re.fullmatch(
                      r"evoxc\.libs/[^/]+\.(?:so(?:\.\d+)?|dylib|dll)", name
                  )]
                  assert not bad, (wheel.name, "evoxc.libs/ may hold only flat shared-library files "
                                   "(.so, .so.<digits>, .dylib, .dll)", bad, sorted(bundled))
                  extensions = [entry for entry in entries if re.fullmatch(
                      r"evoxc/_evoxc_native\.(abi3\.)?(so|pyd|dylib)", entry.filename
                  )]
                  assert len(extensions) == 1 and extensions[0].file_size > 0, wheel.name
          assert seen == expected, expected - seen

          with tarfile.open(sdist) as archive:
              paths = [name.partition("/") for name in archive.getnames()]
          assert {root for root, _, _ in paths} == {f"evoxc-{version}"}, sdist.name
          entries = {entry for _, _, entry in paths}
          crates = ("evoxc", "evoxc-core", "evoxc-compiler", "evoxc-runtime", "evoxc-cpu", "evoxc-python")
          required = {
              "pyproject.toml", "README.md", "LICENSE", "evoxc/__init__.py", "tests/test_packaging.py",
              "native/Cargo.toml", "native/Cargo.lock", *(f"native/{crate}/Cargo.toml" for crate in crates),
          }
          assert required <= entries, required - entries
          assert not any("evoxc_hf" in entry.split("/") for entry in entries), sdist.name
          assert not any(entry.endswith((".so", ".pyd", ".dylib")) for entry in entries), sdist.name
          print(f"Verified all {len(wheels)} cp311-abi3 wheels and {sdist.name}")
          PY

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Upload the verified distributions
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: evoxc-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
