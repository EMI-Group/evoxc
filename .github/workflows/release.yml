# Trusted publishers for both projects are bound to release.yml / pypi.
# An evoxc tag runs the quick release gate, then builds and smoke-tests the release distributions.
# It stages a GitHub draft and makes it public only after PyPI has the same files.
# Manual rehearsals stop after the gate and build checks, without publishing.
name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Release rehearsal (gate, then build and smoke tests)' || format('Release {0}', github.event.release.tag_name || github.ref_name) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.event.created && !github.event.deleted) ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'evoxc-hf-v'))
    runs-on: ubuntu-latest
    outputs:
      checkout_sha: ${{ steps.verify.outputs.checkout_sha }}
      tag: ${{ steps.verify.outputs.tag }}
      tag_oid: ${{ steps.verify.outputs.tag_oid }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        run: python3 .github/workflows/release_checks.py verify

  gate:
    name: Release gate (quick end-to-end)
    needs: verify
    if: github.event_name != 'release'
    uses: ./.github/workflows/release_gate.yml
    with:
      checkout_sha: ${{ needs.verify.outputs.checkout_sha }}
      version: ${{ needs.verify.outputs.version }}

  wheels:
    name: Build and smoke-test release wheels
    needs: [verify, gate]
    if: github.event_name != 'release'
    uses: ./.github/workflows/wheels.yml
    with:
      checkout_sha: ${{ needs.verify.outputs.checkout_sha }}
      version: ${{ needs.verify.outputs.version }}

  prepare:
    name: Prepare and verify evoxc GitHub draft
    needs: [verify, gate, wheels]
    if: github.event_name == 'push' && github.repository == 'EMI-Group/evoxc'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.checkout_sha }}
          path: release-source
          persist-credentials: false
      - name: Require a pinned build artifact
        env:
          ARTIFACT_ID: ${{ needs.wheels.outputs.artifact_id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          {
            printf 'Tested evoxc-dist: https://github.com/%s/actions/runs/%s/artifacts/%s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$ARTIFACT_ID"
            printf '\nIf finalization fails after PyPI publication, use **Re-run failed jobs** in this run. Do not rebuild or retag.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.wheels.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ needs.verify.outputs.checkout_sha }}
          TAG: ${{ needs.verify.outputs.tag }}
          TAG_OID: ${{ needs.verify.outputs.tag_oid }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: python3 release-source/.github/workflows/release_checks.py prepare

  publish-evoxc:
    name: Publish evoxc to PyPI
    needs: [verify, wheels, prepare]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/evoxc
    permissions:
      # GitHub requires write access for the workflow token to see draft releases.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.checkout_sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.wheels.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Recheck the verified draft, tag, and PyPI before uploading
        id: pypi
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ needs.verify.outputs.checkout_sha }}
          TAG: ${{ needs.verify.outputs.tag }}
          TAG_OID: ${{ needs.verify.outputs.tag_oid }}
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: python3 release-source/.github/workflows/release_checks.py preflight
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi.outputs.upload == 'true'

  # If publication succeeded but its response was lost, rerun only the failed
  # job(s) in this run: finalize checks the same artifact ID, without rebuilding
  # wheels or reuploading to PyPI.
  finalize:
    name: Publish or confirm verified evoxc GitHub release
    needs: [verify, wheels, prepare, publish-evoxc]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.checkout_sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.wheels.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_SHA: ${{ needs.verify.outputs.checkout_sha }}
          TAG: ${{ needs.verify.outputs.tag }}
          TAG_OID: ${{ needs.verify.outputs.tag_oid }}
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: python3 release-source/.github/workflows/release_checks.py finalize

  build-evoxc-hf:
    name: Build and verify evoxc-hf
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.checkout_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv build --package evoxc-hf --out-dir dist
      - name: Check exact artifact names and metadata
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          rm -f -- dist/.gitignore
          python3 .github/workflows/release_checks.py manifest
          uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: evoxc-hf-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Require a pinned build artifact
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          printf 'Verified evoxc-hf-dist: https://github.com/%s/actions/runs/%s/artifacts/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"

  publish-evoxc-hf:
    name: Publish evoxc-hf to PyPI
    needs: [verify, build-evoxc-hf]
    if: github.event_name == 'release' && github.repository == 'EMI-Group/evoxc'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/evoxc-hf
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.checkout_sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-evoxc-hf.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Check tag and PyPI state before uploading
        id: pypi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          TAG_OID: ${{ needs.verify.outputs.tag_oid }}
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: python3 release-source/.github/workflows/release_checks.py preflight
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi.outputs.upload == 'true'

  attach-evoxc-hf:
    name: Attach evoxc-hf distributions to GitHub Release
    needs: [verify, build-evoxc-hf, publish-evoxc-hf]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.checkout_sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-evoxc-hf.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          TAG_OID: ${{ needs.verify.outputs.tag_oid }}
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: python3 release-source/.github/workflows/release_checks.py attach-hf
