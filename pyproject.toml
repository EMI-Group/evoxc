[build-system]
# `maturin` — this distribution is a MIXED project: the pure-Python `evoxc`
# package plus the Rust/PyO3 `abi3-py311` extension module
# `evoxc._evoxc_native`, built from the in-repo Rust workspace under `./native/`
# (see `[tool.maturin]` below). `maturin` compiles the extension from source
# and packages platform wheels (e.g. `...-cp311-abi3-linux_x86_64.whl`) with
# one abi3 build covering every supported CPython; a source install needs a
# Rust toolchain and a C compiler. It preserves the PEP 639 license metadata
# below verbatim (`License-Expression` + `License-File` in the wheel METADATA).
# The workspace member `evoxc-hf` stays a pure-Python `uv_build` project, so
# neither distribution can ever contain the other's module.
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "evoxc"
version = "0.2.0"
description = "EvoX Compiler — a minimal, explicit, compiler-neutral tensor graph compiler and runtime"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
# PEP 639: an SPDX license expression + the license file(s) shipped in the
# distribution. The legacy `license = { text = ... }` table and the deprecated
# `License ::` classifiers are deliberately NOT used, so the license is declared
# exactly once, here.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The EvoX Authors" }]
maintainers = [{ name = "The EvoX Authors" }]
keywords = [
    "compiler",
    "tensor",
    "graph",
    "mlir",
    "stablehlo",
    "iree",
    "xla",
    "tvm",
    "numerical-computing",
    "jax-like",
]
# Every classifier is factually true for this package: a pure-Python `evoxc`
# package with a Rust/PyO3 `abi3` extension built from source by maturin, and a
# numpy-only runtime dependency.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
interop = ["torch>=2.0"]  # DLPack interop tests only
dev = ["pytest>=7"]
# Compiler adapters — pluggable, optional. evoxc runs without any of these
# (the numpy interpreter backend is the default; StableHLO MLIR text is
# always exportable). Install an extra to enable the matching backend:
#   pip install evoxc[iree] / evoxc[tvm] / evoxc[compilers]
# The xla adapter has NO pip extra: it drives a USER-PROVIDED PJRT C API
# plugin (.so exporting GetPjRtApi) via ctypes — configure it with the
# EVOXC_PJRT_PLUGIN environment variable or the backend's plugin_path compile
# option. Nothing pip-installable provides the plugin; build one from
# OpenXLA, e.g. `bazel build //xla/pjrt/c:pjrt_c_api_cpu_plugin`.
# NOTE: IREE renamed its PyPI distributions — `iree-compiler`/`iree-runtime`
# are deprecated and STALE (last release 20241104.1068, Nov 2024); the
# current names are `iree-base-compiler`/`iree-base-runtime` (Python
# namespaces unchanged: iree.compiler / iree.runtime). 2.9.0 is the first
# release under the new names. Pin 3.13.x (>=3.13.0,<3.14): 3.13.0 is the
# release evoxc's default paths are validated on — llvm-cpu end-to-end and
# ROCm/HIP device-resident on an AMD Instinct MI300X (gfx942, ROCm 7.1.0),
# covering elementwise+reduce, an int32-counter while_loop, scan, a while
# nested in cond, SO-algorithm-shaped steps and the MO/NSGA2-class
# non_dominate_rank while, all device-resident with numpy parity (integers
# bit-exact, fp32 leaves within reduction-order rounding — relative error
# <= 1e-6, absolute deltas scaling with the operand magnitude). Evidence:
# evoxc/bench/iree313_rocm_findings.md (with its probe and JSON records) and
# evoxc/backends/adapters/CONTEXT.md Known Issues #10 and #21.
# The previous pin was 3.11.x, which shipped two upstream defects: the
# ROCm/HIP HAL aborted at run on loop-carried int32 while/scan graphs (raw
# hip/event_semaphore.c:786: ABORTED ... hal.fence.await), and iree-compile
# 3.10.0/3.11.0 SIGSEGV'd NONDETERMINISTICALLY in
# IREE::Stream::AffinityAnalysis::run() on stablehlo.while-heavy programs
# (>=3 loop-carried values + select in the body — the MO/NSGA2 class), so a
# single successful compile proved nothing. Neither defect reproduces on
# 3.13.0: those while/scan/MO-class shapes compile and run, 0 crashes in 30
# compiles (while-in-cond 5/5 on llvm-cpu and 5/5 on rocm, MO class 10/10 and
# 10/10), and the MO artifact now executes on ROCm bit-exactly, so the
# MO/while-heavy path is no longer upstream-blocked on iree (xla remains an
# equally supported compiled backend, not a required one).
# Scope of that re-validation: llvm-cpu and ROCm only. The 3.13.0 CUDA leg
# was NOT re-exercised (the validating host has no NVIDIA GPU), so every CUDA
# statement in this repository stays scoped to the iree 3.11 release it was
# measured on; multi-rank/collectives, cross-version artifact interop, the
# xla/tvm legs and the HF/benchmark campaigns were likewise not re-run.
# Compiler and runtime versions must MATCH and artifacts are version-specific
# (cross-version artifacts are rejected at load on a bytecode-version
# mismatch); a user who needs another release may pin it explicitly in their
# own environment — version selection is a user decision. See Known Issue #10
# in evoxc/backends/adapters/CONTEXT.md.
iree = ["iree-base-compiler>=3.13.0,<3.14", "iree-base-runtime>=3.13.0,<3.14"]
# tvm needs apache-tvm (StableHLO frontend + Relax VM) and jaxlib — jaxlib
# ONLY for its bundled LLVM MLIR python bindings (the vendored
# `jaxlib.mlir` namespace used by apache-tvm's translator). The `jax`
# package is never imported anywhere.
tvm = ["apache-tvm>=0.26", "jaxlib>=0.10,<0.11"]
compilers = [
    "iree-base-compiler>=3.13.0,<3.14",
    "iree-base-runtime>=3.13.0,<3.14",
    "apache-tvm>=0.26",
    "jaxlib>=0.10,<0.11",
]
# Only needed when running the evoxc.bench conformance/benchmark harness, which
# compares against PyTorch. The evoxc library itself never imports torch, and
# `import evoxc` must work without it.
bench = ["torch>=2.0"]
# HuggingFace integration ships as the SEPARATE distribution `evoxc-hf`, built
# from the workspace member `./evoxc_hf/` (`pip install evoxc-hf`). Its
# oracle-only dependencies (torch/transformers, used solely to validate and
# benchmark it — never at runtime) live behind `evoxc-hf[hf]`, not here.
# `evoxc`'s own hard dependencies stay numpy-only, and `import evoxc` never
# imports `evoxc_hf`, torch or transformers.

# The canonical project repository is `EMI-Group/evoxc` — the same owner/repo the
# release workflow (`.github/workflows/release.yml`), `RELEASING.md` (trusted
# publisher fields) and the CHANGELOG's link references assume.
[project.urls]
Homepage = "https://github.com/EMI-Group/evoxc"
Source = "https://github.com/EMI-Group/evoxc"
Issues = "https://github.com/EMI-Group/evoxc/issues"
Changelog = "https://github.com/EMI-Group/evoxc/blob/main/CHANGELOG.md"
"EvoX ecosystem" = "https://github.com/EMI-Group"
Genesis = "https://github.com/EMI-Group/genesis"

[tool.uv.workspace]
# ONE repo, TWO independent distributions: the root project ships `evoxc`, the
# member `./evoxc_hf/` ships `evoxc-hf` (import name `evoxc_hf`, src layout at
# `evoxc_hf/src/evoxc_hf/`, dependency `evoxc = { workspace = true }`). They
# share this single `uv.lock` at the root but keep one version per project and
# are tagged/published separately: `v<ver>` for evoxc, `evoxc-hf-v<ver>` for
# evoxc-hf.
# Development and CI MUST use `uv sync --all-packages` (e.g.
# `uv sync --locked --all-packages --extra dev`). A PLAIN `uv sync` installs the
# root only and UNINSTALLS the member — leaving the `evoxc_hf/` directory in the
# checkout looking importable as a namespace package, so `import evoxc_hf` would
# silently pick up the wrong (unbuilt) thing instead of the installed
# distribution.
members = ["evoxc_hf"]

[tool.maturin]
# A MIXED project: `python-source = "."` makes the repo-root `evoxc/` package
# the Python half (the flat layout), and `module-name` installs the compiled
# cdylib INSIDE it as `evoxc/_evoxc_native.abi3.so` — exactly the name
# `evoxc/_native.py` discovers. The crate lives in the in-repo Rust workspace
# (`./native/`) and builds `abi3-py311` through its own Cargo features, so one
# wheel per platform serves every supported CPython (3.11+).
manifest-path = "native/evoxc-python/Cargo.toml"
python-source = "."
module-name = "evoxc._evoxc_native"
bindings = "pyo3"
# Release wheels drop the Rust symbol table (a few hundred KiB per platform):
# the extension is a self-contained abi3 cdylib, nothing links against its
# exports. Complements the workspace's `[profile.release]` (opt-level 3,
# thin LTO, codegen-units 1) — the CI `wheels` matrix builds with
# `--release`, so this applies to every platform wheel.
strip = true
# The ONLY shipped Python module of THIS distribution: maturin packages the
# `evoxc` package next to the extension, so the wheel carries `evoxc/` and
# nothing else. The sibling `evoxc-hf` distribution is built from its OWN
# workspace-member project at `./evoxc_hf/src/evoxc_hf/` (a pure-Python
# `uv_build` project), and since each distribution ships exactly one module,
# neither can contain the other.
#
# The checkout paths below ship in the SDIST ONLY (so a built-from-sdist tree
# can still run the test suite); `format = "sdist"` keeps them out of the wheel.
#   tests/**      — the pytest suite that mirrors the package layout
#   assets/**     — README-only SVG diagrams referenced by the packaged README
#   conftest.py   — the root pytest configuration that makes `tests/` importable
#   CHANGELOG.md  — read by the packaged suite's release-hygiene leg
# The whole Rust workspace — `native/Cargo.toml`, `native/Cargo.lock` and every
# crate under `native/` (including the reusable `evoxc` facade crate) — is part
# of the cargo build graph, so maturin carries it in the sdist automatically;
# a source install rebuilds `evoxc/_evoxc_native.abi3.so` from it (the
# `test_evoxc_sdist_is_a_complete_buildable_source_tree` packaging test pins
# that the manifest, the lock and the PyO3 crate are all present).
# Deliberately NOT shipped: the workspace member `evoxc_hf/` (a SEPARATE
# distribution built from its own project) and the dev-built extension (a
# gitignored build product that maturin compiles itself).
include = [
    { path = "tests/**/*", format = "sdist" },
    { path = "assets/**/*", format = "sdist" },
    { path = "conftest.py", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
]
exclude = [{ path = "evoxc/_evoxc_native*.so", format = ["sdist", "wheel"] }]

[tool.pytest.ini_options]
# `tests/` mirrors the `evoxc` package; the workspace member distribution
# `evoxc-hf` keeps its own tests colocated under `evoxc_hf/tests/`.
testpaths = ["tests", "evoxc_hf/tests"]
# `evoxc_hf` lives in the member project's src layout. `uv sync --all-packages`
# installs it, but a venv created by a plain `uv sync` does NOT (see
# [tool.uv.workspace]) — this entry keeps a bare `uv run pytest` able to import
# the member in that case too.
pythonpath = ["evoxc_hf/src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# NOTE: do NOT include "dist" in norecursedirs — `tests/dist/` is a test
# package (pytest's default list would silently skip it).
norecursedirs = [".git", ".genesis", "__pycache__", "*.egg-info", "build", "node_modules", "venv"]
