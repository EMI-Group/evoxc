[build-system]
# `uv_build` — a pure-Python-only build backend (no setuptools, no egg-info, no
# SOURCES.txt manifest that a stale build can poison). It ships EXACTLY ONE
# top-level module per distribution (see `[tool.uv.build-backend]` below), so
# this `evoxc` distribution and the workspace-member `evoxc-hf` distribution can
# never contain each other — a structural guarantee, not a config promise — and
# it preserves the PEP 639 license metadata below verbatim
# (`License-Expression` + `License-File` in the wheel METADATA).
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "evoxc"
version = "0.1.0"
description = "EvoX Compiler — a minimal, explicit, compiler-neutral tensor graph compiler and runtime"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
# PEP 639: an SPDX license expression + the license file(s) shipped in the
# distribution. The legacy `license = { text = ... }` table and the deprecated
# `License ::` classifiers are deliberately NOT used, so the license is declared
# exactly once, here.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The EvoX Authors" }]
maintainers = [{ name = "The EvoX Authors" }]
keywords = [
    "compiler",
    "tensor",
    "graph",
    "mlir",
    "stablehlo",
    "iree",
    "xla",
    "tvm",
    "numerical-computing",
    "jax-like",
]
# Every classifier is factually true for this package: pure Python, numpy-only
# runtime dependency, no native code, no OS-specific behaviour.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
interop = ["torch>=2.0"]  # DLPack interop tests only
dev = ["pytest>=7"]
# Compiler adapters — pluggable, optional. evoxc runs without any of these
# (the numpy interpreter backend is the default; StableHLO MLIR text is
# always exportable). Install an extra to enable the matching backend:
#   pip install evoxc[iree] / evoxc[tvm] / evoxc[compilers]
# The xla adapter has NO pip extra: it drives a USER-PROVIDED PJRT C API
# plugin (.so exporting GetPjRtApi) via ctypes — configure it with the
# EVOXC_PJRT_PLUGIN environment variable or the backend's plugin_path compile
# option. Nothing pip-installable provides the plugin; build one from
# OpenXLA, e.g. `bazel build //xla/pjrt/c:pjrt_c_api_cpu_plugin`.
# NOTE: IREE renamed its PyPI distributions — `iree-compiler`/`iree-runtime`
# are deprecated and STALE (last release 20241104.1068, Nov 2024); the
# current names are `iree-base-compiler`/`iree-base-runtime` (Python
# namespaces unchanged: iree.compiler / iree.runtime). 2.9.0 is the first
# release under the new names. Pin 3.11.x (>=3.11.0,<3.12): iree 3.11.0 was
# EMPIRICALLY validated on this repo's SO-algorithm CUDA path (fresh-process
# crash repro 3/3 clean at ~1000x50/~10000x100 device-resident same-device
# runs — the 3.9.0 class of upstream init-state finalization segfaults is
# GONE — plus a 6-case evox SO harness smoke run in ONE process with 0
# crashes: 5/6 cases device-resident at 0.6-3.4 ms/step with parity ok, the
# 6th (CMAES/Sphere/10000x100) completed but at 5628 ms/step with parity
# rel 0.185 (ok=False) — a slow-path anomaly flagged for follow-up, not a
# crash; see bench_logs/probe_iree_so_cuda.py and
# evoxc/backends/adapters/CONTEXT.md Known Issue #10).
# WARNING (unchanged): iree 3.10.0/3.11.0 still ship an
# upstream COMPILER bug (unbounded Stream AffinityAnalysis DFX recursion →
# iree-compile SIGSEGV on while-loop-heavy programs: stablehlo.while with
# >=3 loop-carried values + select in the body — the MO/NSGA2-class); the
# MO-on-iree path is upstream-blocked and OUT OF SCOPE (xla remains the
# recommended compiled backend for MO per the evox benchmark notes; a user
# needing iree for MO-only compile work may pin 3.9.0 explicitly — artifacts
# are version-specific and compiler/runtime must match, so version selection
# is a user decision; evoxc's validated/default path is 3.11.x). Compiler and
# runtime versions must MATCH (cross-version artifacts are rejected at load)
# — see Known Issue #10 in evoxc/backends/adapters/CONTEXT.md.
iree = ["iree-base-compiler>=3.11.0,<3.12", "iree-base-runtime>=3.11.0,<3.12"]
# tvm needs apache-tvm (StableHLO frontend + Relax VM) and jaxlib — jaxlib
# ONLY for its bundled LLVM MLIR python bindings (the vendored
# `jaxlib.mlir` namespace used by apache-tvm's translator). The `jax`
# package is never imported anywhere.
tvm = ["apache-tvm>=0.26", "jaxlib>=0.10,<0.11"]
compilers = [
    "iree-base-compiler>=3.11.0,<3.12",
    "iree-base-runtime>=3.11.0,<3.12",
    "apache-tvm>=0.26",
    "jaxlib>=0.10,<0.11",
]
# Only needed when running the evoxc.bench conformance/benchmark harness, which
# compares against PyTorch. The evoxc library itself never imports torch, and
# `import evoxc` must work without it.
bench = ["torch>=2.0"]
# HuggingFace integration ships as the SEPARATE distribution `evoxc-hf`, built
# from the workspace member `./evoxc_hf/` (`pip install evoxc-hf`). Its
# oracle-only dependencies (torch/transformers, used solely to validate and
# benchmark it — never at runtime) live behind `evoxc-hf[hf]`, not here.
# `evoxc`'s own hard dependencies stay numpy-only, and `import evoxc` never
# imports `evoxc_hf`, torch or transformers.

# The canonical project repository is `EMI-Group/evoxc` — the same owner/repo the
# release workflow (`.github/workflows/release.yml`), `RELEASING.md` (trusted
# publisher fields) and the CHANGELOG's link references assume.
[project.urls]
Homepage = "https://github.com/EMI-Group/evoxc"
Source = "https://github.com/EMI-Group/evoxc"
Issues = "https://github.com/EMI-Group/evoxc/issues"
Changelog = "https://github.com/EMI-Group/evoxc/blob/main/CHANGELOG.md"
"EvoX ecosystem" = "https://github.com/EMI-Group"
Genesis = "https://github.com/EMI-Group/genesis"

[tool.uv.workspace]
# ONE repo, TWO independent distributions: the root project ships `evoxc`, the
# member `./evoxc_hf/` ships `evoxc-hf` (import name `evoxc_hf`, src layout at
# `evoxc_hf/src/evoxc_hf/`, dependency `evoxc = { workspace = true }`). They
# share this single `uv.lock` at the root but keep one version per project and
# are tagged/published separately: `v<ver>` for evoxc, `evoxc-hf-v<ver>` for
# evoxc-hf.
# Development and CI MUST use `uv sync --all-packages` (e.g.
# `uv sync --locked --all-packages --extra dev`). A PLAIN `uv sync` installs the
# root only and UNINSTALLS the member — leaving the `evoxc_hf/` directory in the
# checkout looking importable as a namespace package, so `import evoxc_hf` would
# silently pick up the wrong (unbuilt) thing instead of the installed
# distribution.
members = ["evoxc_hf"]

[tool.uv.build-backend]
# This repo uses a FLAT layout (`./evoxc/` sits at the root, not under `src/`),
# so the module root is the repository root itself. Without `module-root = ""`
# uv_build assumes src-layout and fails with
# "Expected a Python module at: src/evoxc/__init__.py".
module-root = ""
# The ONLY shipped module of THIS distribution. uv_build packages exactly the
# `<module-root>/<name>` directory, so this wheel/sdist carries `evoxc` and
# nothing else. The sibling `evoxc-hf` distribution is built from its OWN
# workspace-member project at `./evoxc_hf/src/evoxc_hf/`, and since each
# distribution ships exactly one module, neither can contain the other — not a
# glob that could be widened by accident.
module-name = "evoxc"
# The sdist additionally ships these checkout paths (anchored patterns; `**`
# recurses), so a built-from-sdist tree can still run the test suite:
#   tests/**      — the pytest suite that mirrors the package layout
#   assets/**     — README-only SVG diagrams referenced by the packaged README
#   conftest.py   — the root pytest configuration that makes `tests/` importable
#   CHANGELOG.md  — read by the packaged suite's release-hygiene leg, so that
#                   leg works from an unpacked sdist too
# Deliberately NOT shipped: the workspace member `evoxc_hf/` (a SEPARATE
# distribution built from its own project at `./evoxc_hf/`, hence never part of
# this project's sdists), `bench_logs/` (benchmark scratch area) and the root
# probe scripts (`probe_new_emitters.py`).
source-include = ["tests/**", "assets/**", "conftest.py", "CHANGELOG.md"]

[tool.pytest.ini_options]
# `tests/` mirrors the `evoxc` package; the workspace member distribution
# `evoxc-hf` keeps its own tests colocated under `evoxc_hf/tests/`.
testpaths = ["tests", "evoxc_hf/tests"]
# `evoxc_hf` lives in the member project's src layout. `uv sync --all-packages`
# installs it, but a venv created by a plain `uv sync` does NOT (see
# [tool.uv.workspace]) — this entry keeps a bare `uv run pytest` able to import
# the member in that case too.
pythonpath = ["evoxc_hf/src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# NOTE: do NOT include "dist" in norecursedirs — `tests/dist/` is a test
# package (pytest's default list would silently skip it).
norecursedirs = [".git", ".genesis", "__pycache__", "*.egg-info", "build", "node_modules", "venv"]
