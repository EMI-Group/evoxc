# Documentation-infrastructure config for the evoxc docs site
# (https://compiler.evox.group, a Nimbus/Astro site under ./docs-site/).
#
# Consumed by the reusable workflows in EMI-Group/evox-docs-infra:
#   .github/workflows/docs-site.yml     — build.yml + deploy.yml (the site)
#   `docs-infra python-api`             — generated Python API reference pages
#   `docs-infra translate`              — translations (disabled below)
#
# The site's own authoring and deployment contract lives in
# ./docs-site/CONTEXT.md.
version: 1
translation:
  source_locale: en
  # Single-language site. To publish translated pages, add the locale IDs here
  # (for example [zh-cn]), register the matching Nimbus `docs-<locale>`
  # collection and route in docs-site/, and add the
  # .github/workflows/docs-translate.yml caller from the toolkit starter.
  locales: []
  release_policy: release-series
  sources:
    - source: docs-site/src/content/docs
      output: docs-site/src/content/docs-{locale}
      exclude: [api]
  glossary:
    zh-cn:
      evoxc: evoxc
      EvoX Compiler: EvoX Compiler
# Generated Python API reference pages (`docs-infra python-api`): Griffe static
# analysis (the packages are never imported) renders the public namespaces and
# their docstrings into ordinary Nimbus pages under
# `docs-site/src/content/docs/api/`. That tree is COMMITTED — it is the
# documented API of the two distributions — and regenerated by the site build
# and by hand whenever a docstring changes (see ./docs-site/CONTEXT.md).
#
# One list entry per distribution. Site-wide keys (`output`, `url_prefix`,
# `repository`, `revision`) are declared on the first entry and inherited by
# the second.
python_api:
  - package: evoxc
    source_path: .
    # The first module that exports a symbol owns its canonical page URL, so the
    # definition modules come before the sugar namespaces. The top-level `evoxc`
    # namespace is deliberately absent: its `__all__` is computed at import time
    # (`sorted(name for name in globals() ...)`), which Griffe's static analysis
    # cannot evaluate, so it yields no symbols; ./docs-site/ hand-writes the
    # top-level surface instead.
    modules:
      - evoxc.core
      - evoxc.ir
      - evoxc.ops
      - evoxc.numpy
      - evoxc.trace
      - evoxc.transforms
      - evoxc.block
      - evoxc.backends
      - evoxc.pipeline
      - evoxc.dist
      - evoxc.sparse
      - evoxc.persist
      - evoxc.formats
      - evoxc.external
      - evoxc.random
      - evoxc.build_cache
      - evoxc.io
    # No exclusions: page paths are lowercased, so a class/function pair that
    # differs only in case (``evoxc.ir.OpDef`` / ``evoxc.ir.opdef``,
    # ``evoxc.dist.Group`` / ``evoxc.dist.group``) is disambiguated by the
    # generator — the first sorted name keeps the plain path and the later one
    # gets a ``-class``/``-function`` suffix.
    docstring_style: auto
    output: docs-site/src/content/docs/api
    url_prefix: /api
    repository: https://github.com/EMI-Group/evoxc
    # A stable ref keeps the "View Python source" links (and therefore the
    # committed pages) unchanged between commits: regeneration only rewrites
    # pages whose docstrings changed. Never pin the generation to a commit SHA.
    revision: main
  - package: evoxc_hf
    source_path: evoxc_hf/src
    # The definition modules come first so each symbol's canonical page sits in
    # the module that defines it; the top-level `evoxc_hf` namespace comes last
    # and links its submodules.
    modules:
      - evoxc_hf.config
      - evoxc_hf.errors
      - evoxc_hf.families
      - evoxc_hf.load
      - evoxc_hf.ops
      - evoxc_hf.pack
      - evoxc_hf.pipeline
      - evoxc_hf.program
      - evoxc_hf.reference
      - evoxc_hf.weights
      - evoxc_hf
    docstring_style: auto
