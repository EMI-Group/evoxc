[workspace]
resolver = "2"
members = ["evoxc-core", "evoxc-compiler", "evoxc-runtime", "evoxc-cpu", "evoxc-python"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/EMI-Group/evoxc"

[workspace.dependencies]
evoxc-core = { path = "evoxc-core" }
evoxc-compiler = { path = "evoxc-compiler" }
evoxc-runtime = { path = "evoxc-runtime" }
evoxc-cpu = { path = "evoxc-cpu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

# Native builds dominate the edit/test loop; keep debug info light but usable.
[profile.dev]
debug = 1
