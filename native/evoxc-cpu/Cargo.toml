[package]
name = "evoxc-cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native CPU execution engine for EvoX Compiler: compiled dispatch plans over typed host buffers."
[dependencies]
evoxc-core.workspace = true
# The N-dimensional array library: every N-d axis/layout/broadcast rule and the
# reference broadcast/reduction/indexing semantics live here (never `blas`,
# never an ndarray `rayon` feature — the engine's own scoped threads stay the
# only threading in the elementwise/reduction paths).
ndarray = "0.17"
# Dense linear algebra (`dot`'s f32/f64 gemm, and the factorizations where its
# conventions match numpy's). Its `rayon` feature supplies gemm's own work
# splitting; no other kernel uses rayon.
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
half = "2"
num-complex = "0.4"
libm = "0.2"
serde_json = "1"
